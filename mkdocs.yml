# Project information
site_name: AI on IBM Z 101
site_url: https://ibm.github.io/ai-on-z-101/
site_author: IBM Developer
site_description: Official guide to AI and Machine Learning on IBM Z and LinuxONE. Discover architectures, use cases, AI lifecycle workflows, watsonx, and the IBM Telum on-chip AI accelerator.

# Repository
repo_name: ai-on-z-101
repo_url: https://github.com/IBM/ai-on-z-101
edit_uri: edit/main/docs

# Navigation
nav:
  - Home: README.md
  - Use Cases:
      - Overview: use-cases/overview.md
      - Advanced Credit Card Fraud Detection: use-cases/use-cases.md
      - Solution Blueprints: use-cases/ai-solution-template.md
      - Non-Business Use Cases: use-cases/business-use-cases.md
  - AI Lifecycle:
      - Overview: prepare-data/lifecycle-overview.md
      - Prepare Data: prepare-data/prepare-data.md
      - Build Models: build-model/build-model.md
      - Deploy Models: deploy-models/deploy-models.md
      - Serve Model: serve-model/serve-model.md
      - AI Governance: ai-governance/ai-governance.md
  - Products & Tools:
      - Overview: products-tools/overview.md
      - Data & Analytics: products-tools/data-analytics.md
      - AI Frameworks & Dev Tools: products-tools/ai-frameworks.md
      - Model Formats & Compilers: products-tools/model-formats.md
      - Inference & Serving: products-tools/inference-serving.md
      - AI Platforms: products-tools/ai-platforms.md
      - Hardware: products-tools/hardware-solutions.md
      - Turnkey & ISV Solutions: products-tools/turnkey-solutions.md
  - Resources & Contacts: getting-help/terminology.md

## DO NOT CHANGE BELOW THIS LINE

# Copyright
copyright: Copyright &copy; 2026 IBM Developer

# Theme
theme:
  name: material
  custom_dir: overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/library
  features:
    - navigation.tabs
    - navigation.instant
  palette:
    scheme: default
    primary: blue
    accent: blue

# Custom styling (IBM Carbon look from the HTML source site)
extra_css:
  - stylesheets/ibm-theme.css

extra_javascript:
  - javascripts/open-accordion.js

# Plugins
plugins:
  - search
  - redirects:
      redirect_maps:
        # Legacy root pages
        'aitoolkitloz.md': 'products-tools/ai-frameworks.md'
        'codingAIU.md': 'products-tools/hardware-solutions.md'
        'help.md': 'getting-help/terminology.md'
        'infusing.md': 'prepare-data/lifecycle-overview.md'
        'onnxconv.md': 'products-tools/model-formats.md'
        'onnxdlc.md': 'products-tools/model-formats.md'
        'opensource.md': 'products-tools/ai-frameworks.md'
        'pmmlconv.md': 'products-tools/model-formats.md'
        'pyaitoolkit.md': 'products-tools/ai-frameworks.md'
        'pytorch.md': 'products-tools/ai-frameworks.md'
        'resources.md': 'getting-help/terminology.md'
        'snapml.md': 'products-tools/ai-frameworks.md'
        'solutiontemplates.md': 'use-cases/ai-solution-template.md'
        'tensorflow.md': 'products-tools/ai-frameworks.md'
        'terminology.md': 'getting-help/terminology.md'
        'tritonis.md': 'products-tools/inference-serving.md'
        'zAccel.md': 'products-tools/hardware-solutions.md'
        # Legacy blog posts
        'blog/index.md': 'README.md'
        'blog/posts/IBM_2Q_2025_Announcement.md': 'README.md'
        'blog/posts/ai-solution-templates.md': 'use-cases/ai-solution-template.md'
        'blog/posts/ai-toolkit.md': 'products-tools/ai-frameworks.md'
        'blog/posts/redbooks.md': 'getting-help/terminology.md'
        'blog/posts/toolkit-pytorch.md': 'products-tools/ai-frameworks.md'
        'blog/posts/wmlz-new.md': 'products-tools/ai-platforms.md'
        # Legacy dated blog URLs
        'blog/2023/07/07/updates-to-our-101-pages/index.md': 'README.md'
        'blog/2024/01/12/launch-of-ai-toolkit-for-ibm-z-and-linuxone/index.md': 'products-tools/ai-frameworks.md'
        'blog/2024/03/15/launch-of-ai-solution-templates-on-ibm-z--linuxone/index.md': 'use-cases/ai-solution-template.md'
        'blog/2024/06/20/new-linux-on-z-focused-redbook-asset/index.md': 'getting-help/terminology.md'
        'blog/2024/11/22/updates-to-our-101-pages/index.md': 'README.md'
        'blog/archive/2023/index.md': 'README.md'
        'blog/archive/2024/index.md': 'README.md'
        'blog/category/documentation/index.md': 'README.md'
        'blog/category/general/index.md': 'README.md'
        'blog/category/site-updates/index.md': 'README.md'

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
