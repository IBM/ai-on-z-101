# Project information
site_name: AI on IBM Z 101 
site_url: https://ibm.github.io/ai-on-z-101/
site_author: IBM Developer

# Repository
repo_name: ai-on-z-101
repo_url: https://github.com/IBM/ai-on-z-101
edit_uri: edit/main/docs

# Navigation
nav:
  - Home: README.md
  - Use Cases:
      - Overview: use-cases/overview.md
      - Advanced Credit Card Fraud Detection: use-cases/use-cases.md
      - Solution Blueprints: use-cases/ai-solution-template.md
      - Non-Business Use Cases: use-cases/business-use-cases.md
  - AI Lifecycle:
      - Overview: prepare-data/lifecycle-overview.md
      - Prepare Data: prepare-data/prepare-data.md
      - Build Models: build-model/build-model.md
      - Deploy Models: deploy-models/deploy-models.md
      - Serve Model: serve-model/serve-model.md
      - AI Governance: ai-governance/ai-governance.md
  - Products & Tools:
      - Overview: products-tools/overview.md
      - Data & Analytics: products-tools/data-analytics.md
      - AI Frameworks & Dev Tools: products-tools/ai-frameworks.md
      - Model Formats & Compilers: products-tools/model-formats.md
      - Inference & Serving: products-tools/inference-serving.md
      - AI Platforms: products-tools/ai-platforms.md
      - Hardware: products-tools/hardware-solutions.md
      - Turnkey & ISV Solutions: products-tools/turnkey-solutions.md
  - Getting Help: getting-help/terminology.md
  - Updates and news:
      - blog/index.md

## DO NOT CHANGE BELOW THIS LINE

# Copyright
copyright: Copyright &copy; 2020 IBM Developer

# Theme
theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/library
  features:
    - navigation.tabs
    - navigation.instant
  palette:
    scheme: default
    primary: blue
    accent: blue

# Custom styling (IBM Carbon look from the HTML source site)
extra_css:
  - stylesheets/ibm-theme.css

# Plugins
plugins:
  - search
  - blog

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ibm
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ibmdeveloper
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ibm/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/user/developerworks
    - icon: fontawesome/brands/dev
      link: https://dev.to/ibmdeveloper

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
